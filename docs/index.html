<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Soldier Cinematic Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #container {
            width: 100%;
            max-width: 1200px;
            height: 700px;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            position: relative;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            z-index: 10;
            border: 1px solid #00ff00;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 5px;
            color: #00ff00;
            font-size: 14px;
            z-index: 10;
            border: 1px solid #00ff00;
            font-family: 'Courier New', monospace;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: all 0.3s;
        }
        button:hover {
            background: #00cc00;
            transform: scale(1.05);
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-size: 24px;
            z-index: 5;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas"></div>
        <div class="info">
            <div>🎬 SOLDIER CINEMATIC ANIMATION</div>
            <div style="font-size: 12px; margin-top: 8px;">Mission Ready</div>
        </div>
        <div class="controls">
            <div>⌨️ CONTROLS</div>
            <div style="margin-top: 8px; font-size: 12px;">
                SPACE - Fire Shot<br>
                R - Reset Animation<br>
                C - Change Camera<br>
                M - Mute/Unmute
            </div>
            <button onclick="fireShot()">FIRE (SPACE)</button>
            <button onclick="resetAnimation()">RESET (R)</button>
            <button onclick="changeCamera()">CAMERA (C)</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene Setup
        const container = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setClearColor(0x87ceeb);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting - Cinematic
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(50, 50, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        // Volumetric lighting effect
        const spotLight = new THREE.SpotLight(0xffaa00, 0.8);
        spotLight.position.set(30, 40, 20);
        spotLight.castShadow = true;
        scene.add(spotLight);

        // Ground
        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x4a7c3b });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Environment - Training Range
        const rangeWall = new THREE.BoxGeometry(150, 2, 2);
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x8b7355 });
        const wall = new THREE.Mesh(rangeWall, wallMaterial);
        wall.position.set(0, 1, -80);
        wall.receiveShadow = true;
        scene.add(wall);

        // Target
        const targetGroup = new THREE.Group();
        const targetBack = new THREE.BoxGeometry(3, 3, 0.5);
        const targetBackMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const targetBackMesh = new THREE.Mesh(targetBack, targetBackMat);
        targetBackMesh.castShadow = true;
        targetBackMesh.receiveShadow = true;
        targetGroup.add(targetBackMesh);

        // Bullseye circles
        for (let i = 0; i < 5; i++) {
            const circleGeometry = new THREE.CircleGeometry(1.5 - i * 0.3, 32);
            const circleMaterial = new THREE.MeshStandardMaterial({
                color: i % 2 === 0 ? 0xffffff : 0x000000,
                emissive: i === 0 ? 0xff0000 : 0x000000
            });
            const circle = new THREE.Mesh(circleGeometry, circleMaterial);
            circle.position.z = 0.3 + i * 0.01;
            targetGroup.add(circle);
        }

        targetGroup.position.set(0, 1.5, -60);
        scene.add(targetGroup);

        // Create Soldier
        const soldier = createSoldier();
        soldier.position.set(0, 0, 10);
        scene.add(soldier);

        function createSoldier() {
            const group = new THREE.Group();

            // Body
            const bodyGeometry = new THREE.CapsuleGeometry(0.4, 1.5, 8, 8);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x3d5c4a });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Head
            const headGeometry = new THREE.SphereGeometry(0.35, 32, 32);
            const skinMaterial = new THREE.MeshStandardMaterial({ color: 0xd4a574 });
            const head = new THREE.Mesh(headGeometry, skinMaterial);
            head.position.y = 2.5;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);

            // Helmet
            const helmetGeometry = new THREE.SphereGeometry(0.38, 32, 32);
            const helmetMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2a2a2a,
                roughness: 0.4
            });
            const helmet = new THREE.Mesh(helmetGeometry, helmetMaterial);
            helmet.position.y = 2.5;
            helmet.castShadow = true;
            group.add(helmet);

            // Eyes with glow
            const eyeGeometry = new THREE.SphereGeometry(0.1, 16, 16);
            const eyeMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x000000,
                emissive: 0x333333
            });
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.12, 2.6, 0.32);
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.12, 2.6, 0.32);
            group.add(leftEye);
            group.add(rightEye);

            // Left Arm
            const leftArmGeometry = new THREE.CapsuleGeometry(0.15, 1, 8, 8);
            const armMaterial = new THREE.MeshStandardMaterial({ color: 0x3d5c4a });
            const leftArm = new THREE.Mesh(leftArmGeometry, armMaterial);
            leftArm.position.set(-0.6, 1.7, 0);
            leftArm.rotation.z = 0.2;
            leftArm.castShadow = true;
            group.add(leftArm);

            // Right Arm (will hold rifle)
            const rightArm = new THREE.Mesh(leftArmGeometry, armMaterial);
            rightArm.position.set(0.6, 1.7, 0);
            rightArm.rotation.z = -0.2;
            rightArm.castShadow = true;
            group.add(rightArm);
            group.rightArm = rightArm;

            // Left Leg
            const legGeometry = new THREE.CapsuleGeometry(0.15, 1.2, 8, 8);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.3, 0.4, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);

            // Right Leg
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.3, 0.4, 0);
            rightLeg.castShadow = true;
            group.add(rightLeg);

            // Tactical Gear
            const chestRigGeometry = new THREE.BoxGeometry(0.5, 0.8, 0.3);
            const rigMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
            const chestRig = new THREE.Mesh(chestRigGeometry, rigMaterial);
            chestRig.position.set(0, 1.2, 0.2);
            chestRig.castShadow = true;
            group.add(chestRig);

            // Backpack
            const backpackGeometry = new THREE.BoxGeometry(0.4, 0.7, 0.5);
            const backpack = new THREE.Mesh(backpackGeometry, rigMaterial);
            backpack.position.set(0, 1.2, -0.4);
            backpack.castShadow = true;
            group.add(backpack);

            // Rifle
            const rifle = createRifle();
            group.add(rifle);
            group.rifle = rifle;

            return group;
        }

        function createRifle() {
            const rifleGroup = new THREE.Group();

            // Barrel
            const barrelGeometry = new THREE.CylinderGeometry(0.08, 0.08, 2.5, 16);
            const metalMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a2a,
                metalness: 0.8,
                roughness: 0.2
            });
            const barrel = new THREE.Mesh(barrelGeometry, metalMaterial);
            barrel.rotation.z = Math.PI / 2;
            barrel.position.set(0.5, 1.8, -0.2);
            barrel.castShadow = true;
            rifleGroup.add(barrel);

            // Stock
            const stockGeometry = new THREE.BoxGeometry(0.15, 0.15, 1.2);
            const stock = new THREE.Mesh(stockGeometry, metalMaterial);
            stock.rotation.z = Math.PI / 2;
            stock.position.set(-0.3, 1.7, 0);
            stock.castShadow = true;
            rifleGroup.add(stock);

            // Scope
            const scopeGeometry = new THREE.CylinderGeometry(0.12, 0.12, 0.4, 16);
            const scope = new THREE.Mesh(scopeGeometry, metalMaterial);
            scope.rotation.z = Math.PI / 2;
            scope.position.set(0.1, 2.1, 0);
            scope.castShadow = true;
            rifleGroup.add(scope);

            return rifleGroup;
        }

        // Camera positions
        let cameraMode = 0;
        const cameraModes = [
            { pos: [0, 2, 15], target: [0, 1.5, -20] },
            { pos: [8, 2, 5], target: [0, 1.5, 0] },
            { pos: [-2, 2.5, 2], target: [0.5, 2, -5] }
        ];

        // Animation state
        let isFiring = false;
        let fireProgress = 0;
        let smokeParticles = [];

        function fireShot() {
            if (isFiring) return;
            isFiring = true;
            fireProgress = 0;

            // Add recoil
            const originalPos = soldier.rifle.position.clone();
            const originalRot = soldier.rifle.rotation.clone();

            // Create muzzle flash
            const flashGeometry = new THREE.SphereGeometry(0.3, 8, 8);
            const flashMaterial = new THREE.MeshBasicMaterial({ color: 0xff6600 });
            const flash = new THREE.Mesh(flashGeometry, flashMaterial);
            flash.position.copy(soldier.rifle.position);
            flash.position.x += 1.5;
            scene.add(flash);

            // Create smoke
            createSmoke(flash.position);

            setTimeout(() => {
                scene.remove(flash);
            }, 100);

            // Bullet hit effect
            setTimeout(() => {
                createBulletHole();
            }, 200);
        }

        function createSmoke(position) {
            for (let i = 0; i < 10; i++) {
                const smokeGeometry = new THREE.SphereGeometry(0.2, 8, 8);
                const smokeMaterial = new THREE.MeshStandardMaterial({
                    color: 0x888888,
                    transparent: true,
                    opacity: 0.6,
                    emissive: 0x444444
                });
                const smoke = new THREE.Mesh(smokeGeometry, smokeMaterial);
                smoke.position.copy(position);
                smoke.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.05,
                    Math.random() * 0.03 + 0.01,
                    (Math.random() - 0.5) * 0.05
                );
                smoke.life = 1;
                scene.add(smoke);
                smokeParticles.push(smoke);
            }
        }

        function createBulletHole() {
            const holeGeometry = new THREE.CircleGeometry(0.1, 16);
            const holeMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const hole = new THREE.Mesh(holeGeometry, holeMaterial);
            hole.position.set(0, 1.5, -59.8);
            scene.add(hole);

            // Spark effect
            for (let i = 0; i < 5; i++) {
                createSpark(hole.position);
            }
        }

        function createSpark(position) {
            const sparkGeometry = new THREE.SphereGeometry(0.05, 4, 4);
            const sparkMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const spark = new THREE.Mesh(sparkGeometry, sparkMaterial);
            spark.position.copy(position);
            spark.velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.1,
                Math.random() * 0.05 + 0.02,
                (Math.random() - 0.5) * 0.1
            );
            spark.life = 0.5;
            scene.add(spark);
            smokeParticles.push(spark);
        }

        function changeCamera() {
            cameraMode = (cameraMode + 1) % cameraModes.length;
        }

        function resetAnimation() {
            isFiring = false;
            fireProgress = 0;
            cameraMode = 0;
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                fireShot();
            }
            if (e.key === 'r' || e.key === 'R') resetAnimation();
            if (e.key === 'c' || e.key === 'C') changeCamera();
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Camera smooth movement
            const targetMode = cameraModes[cameraMode];
            camera.position.lerp(
                new THREE.Vector3(...targetMode.pos),
                0.05
            );

            const targetLookAt = new THREE.Vector3(...targetMode.target);
            const currentLookAt = new THREE.Vector3();
            camera.getWorldDirection(currentLookAt);
            camera.lookAt(targetLookAt);

            // Firing animation
            if (isFiring) {
                fireProgress += 0.05;
                if (fireProgress < 0.1) {
                    // Recoil
                    soldier.rifle.position.x -= 0.15;
                    soldier.rifle.rotation.y -= 0.1;
                    soldier.rightArm.rotation.x -= 0.2;
                } else if (fireProgress < 0.2) {
                    // Recovery
                    soldier.rifle.position.x += 0.075;
                    soldier.rifle.rotation.y += 0.05;
                    soldier.rightArm.rotation.x += 0.1;
                }
                if (fireProgress > 1) {
                    isFiring = false;
                }
            }

            // Update particles
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const particle = smokeParticles[i];
                particle.position.add(particle.velocity);
                particle.life -= 0.02;
                particle.material.opacity = particle.life;

                if (particle.life <= 0) {
                    scene.remove(particle);
                    smokeParticles.splice(i, 1);
                }
            }

            // Breathing animation
            const breathe = Math.sin(Date.now() * 0.001) * 0.05;
            soldier.position.y = breathe;

            // Slight aiming animation
            soldier.rifle.rotation.x = Math.sin(Date.now() * 0.0005) * 0.02;

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
